[project]
name = "p3erp"
authors = [
    { name = "P3ERP", email = "dev@p3erp.com"}
]
description = "Dynamic Apparel Manufacturing ERP System"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # frappe/erpnext are provided by the bench environment - do not pin
    # them here, they're installed as part of the bench "apps" list.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "p3erp"

[tool.bench.dev-dependencies]
# pytest, ruff, etc. can be added here as the team standardizes on tooling
